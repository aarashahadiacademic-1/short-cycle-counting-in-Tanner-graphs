name: KB optimization A/B
on:
  push:
    paths:
      - '.github/workflows/kb-ab.yml'
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Obtain only R/P graph inputs
        run: git clone --quiet --depth=1 https://github.com/aarashahadiacademic-1/tanner-cycle-counting.git /tmp/reference-tanner-graphs
      - name: Compare old and new on 17 graphs, same pinned CPU
        run: |
          python3 generate_graphs.py
          g++ -std=c++17 -O3 -DNDEBUG four_algorithms.cpp -o /tmp/original
          g++ -std=c++17 -O3 -DNDEBUG kb_optimization_candidate.cpp -o /tmp/optimized
          python3 - <<'PY'
          import csv,json,subprocess,os
          from pathlib import Path
          os.sched_setaffinity(0,{min(os.sched_getaffinity(0))})
          data=list(csv.DictReader(open("FINAL_TABLE.csv")))
          faster=0
          for r in data:
              n=r["graph"]; g=r["g"]
              p=Path("/tmp/reference-tanner-graphs/graphs" if n.startswith(("R","P")) else "graphs")/(n+".edges")
              old=json.loads(subprocess.check_output(["/tmp/original",str(p),g,"3","1"],text=True,timeout=120))
              new=json.loads(subprocess.check_output(["/tmp/optimized",str(p),g,"7","1"],text=True,timeout=120))
              if old["Ng"]!=new["Ng"] or old["Ng"]!=int(r["Ng"]):raise RuntimeError(f"COUNT MISMATCH {n}: {old} {new}")
              faster+=new["KB_ms"]<old["KB_ms"]
              print("AB",n,"KB_old",old["KB_ms"],"KB_new",new["KB_ms"],"IMPA_new",new["IMPA_ms"],"Exact_new",new["Exact_ms"],"Hybrid_new",new["Hybrid_ms"],"COUNT",new["Ng"],flush=True)
          print("SPEEDUPS",faster,"OF",len(data),flush=True)
          PY
